<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in — trusted-site.com</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; color: #222; text-align: center; }
    .badge { background: #fbe9e7; color: #b3331d; padding: 4px 10px; border-radius: 4px; font-size: 12px; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #2f6f4f; color: #fff; border: 0; padding: 10px 16px; border-radius: 4px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <span class="badge">trusted-site.com (session expired)</span>
  <h2>Please sign in again</h2>
  <input type="email" placeholder="you@example.com">
  <input type="password" placeholder="••••••••">
  <button onclick="alert('DEMO ONLY — nothing was sent anywhere.')">Sign in</button>
  <p style="font-size:12px;color:#6b7280;">
    This page loaded because of a plain <code>&lt;meta http-equiv="refresh"&gt;</code>
    tag — no JavaScript involved at all.
  </p>
</body>
</html>
